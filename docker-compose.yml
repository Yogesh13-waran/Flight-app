version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pulsenotify_db
    environment:
      POSTGRES_DB: ${DB_NAME:-pulsenotify_db}
      POSTGRES_USER: ${DB_USER:-pulsenotify_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulsenotify_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pulsenotify_user} -d ${DB_NAME:-pulsenotify_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsenotify_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

